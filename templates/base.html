<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión - Hospital Aurelio Crespo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-dark px-4 py-3 shadow-sm" style="background-color: #0a2540;">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center gap-2 m-0 fw-bold tracking-tight" href="{% url 'dashboard' %}" style="font-size: 1.2rem;">
                <i class="bi bi-hospital text-info"></i> Gestión Hospitalaria
            </a>
            
            {% if user.is_authenticated %}
            <div class="d-flex align-items-center gap-3 text-white-50" style="font-size: 0.9rem;">
                <span>Usuario: <strong class="text-white">{{ user.username }}</strong></span>
                <span class="text-secondary">|</span>
                <form method="post" action="{% url 'logout' %}" class="d-inline m-0">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-link text-white-50 text-decoration-none p-0 bg-transparent border-0 align-baseline hover-white" style="font-size: 0.9rem; transition: color 0.2s;">
                        Cerrar Sesión
                    </button>
                </form>
            </div>
            {% endif %}
        </div>
    </nav>

    <main class="flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-white border-top py-3 text-center mt-auto">
        <div class="container">
            <span class="text-muted small">© 2026 Hospital Aurelio Crespo — Sistema de Auditoría Interna de Planta</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
