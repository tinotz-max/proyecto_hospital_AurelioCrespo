{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow-lg border-0">
            <div class="card-header bg-primary text-white text-center py-3">
                <h4 class="mb-0">Gestión de Stock Hospitalario</h4>
            </div>
            <div class="card-body p-4">
                <h5 class="text-center text-secondary mb-4">Ingreso al Sistema</h5>
                
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="id_username" class="form-label text-muted">Nombre de usuario</label>
                        <input type="text" name="username" autofocus maxlength="150" required id="id_username" 
                               class="form-control form-control-lg" placeholder="Ej: santino_admin">
                    </div>

                    <div class="mb-4">
                        <label for="id_password" class="form-label text-muted">Contraseña</label>
                        <input type="password" name="password" required id="id_password" 
                               class="form-control form-control-lg" placeholder="••••••••">
                    </div>

                    {% if form.errors %}
                    <div class="alert alert-danger p-2 small">
                        Usuario o contraseña incorrectos.
                    </div>
                    {% endif %}

                    <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm">
                        Entrar al Panel
                    </button>
                </form>
            </div>
        </div>
        <p class="text-center mt-4 text-muted small">© 2024 Hospital - Sistema de Control de Insumos</p>
    </div>
</div>
{% endblock %}
